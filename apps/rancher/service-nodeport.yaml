apiVersion: v1
kind: Service
metadata:
  name: rancher-nodeport
  namespace: cattle-system
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
      nodePort: 8086
      name: http
    - port: 443
      targetPort: 443
      nodePort: 8446
      name: https
  selector:
    app: rancher
