apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: immich
  namespace: immich
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:16.6
  storage:
    size: 20Gi
    storageClass: local-storage
  bootstrap:
    initdb:
      database: immich
      owner: UserImmich
      secret:
        name: immich-cnpg-secret
